[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datajud-cli"
version = "0.1.0"
description = "CLI to query Brazilian judicial process data from CNJ DataJud API"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
datajud = "datajud_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["datajud_cli*"]